name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build contracts
        run: cd packages/contracts && pnpm exec tsc
      
      - name: Build reasoning
        run: cd packages/reasoning && pnpm exec tsc
      
      - name: Run tests
        run: cd tests && pnpm exec vitest run
      
      - name: Build desktop app
        run: cd apps/desktop && pnpm run build
